<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Generated Video</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1313ec",
            "background-light": "#f6f6f8",
            "background-dark": "#101022",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden group/design-root">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-black dark:text-white flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Generated Video</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-black dark:text-white gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
<span class="material-symbols-outlined text-2xl">share</span>
</button>
</div>
</div>
<div class="h-5 bg-background-light dark:bg-background-dark"></div>
<!-- Media Player -->
<div class="px-4">
<div class="relative flex items-center justify-center bg-zinc-200 dark:bg-zinc-800 bg-cover bg-center aspect-video rounded-xl overflow-hidden" data-alt="A futuristic cityscape with flying vehicles and neon lights, generated by AI.">
<div class="absolute inset-0 bg-gradient-to-t from-black/5 to-transparent"></div>
<button class="flex shrink-0 items-center justify-center rounded-full size-16 bg-black/40 text-white z-10">
<span class="material-symbols-outlined text-4xl">play_arrow</span>
</button>
<div class="absolute inset-x-0 bottom-0 px-4 py-3">
<div class="flex items-center justify-center gap-2">
<div class="h-1.5 flex-1 rounded-full bg-primary/30">
<div class="h-full w-1/3 rounded-full bg-primary relative">
<div class="absolute -right-2 -top-1 size-4 rounded-full bg-primary border-2 border-background-light dark:border-background-dark"></div>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-1.5">
<p class="text-white text-xs font-medium leading-normal tracking-[0.015em]">0:37</p>
<p class="text-white text-xs font-medium leading-normal tracking-[0.015em]">2:23</p>
</div>
</div>
</div>
</div>
<div class="h-5 bg-background-light dark:bg-background-dark"></div>
<!-- Video Info -->
<div class="px-4 flex flex-col gap-1">
<p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Prompt: "A futuristic cityscape with flying vehicles..."</p>
<p class="text-xs text-gray-400 dark:text-gray-500">Duration: 2:23 | Resolution: 1080p | Generated: 2024-07-26</p>
</div>
<div class="h-5 bg-background-light dark:bg-background-dark flex-grow"></div>
<!-- Download Button -->
<div class="flex px-4 py-3 sticky bottom-0 bg-background-light dark:bg-background-dark">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-primary text-white gap-2 pl-5 text-base font-bold leading-normal tracking-[0.015em]">
<span class="material-symbols-outlined">download</span>
<span class="truncate">Download</span>
</button>
</div>
</div>
</body></html>
