<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>API Key Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4285F4",
            "background-light": "#F8F9FA",
            "background-dark": "#101022",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col">
<div class="flex items-center p-4 pb-2 justify-start bg-background-light dark:bg-background-dark">
<div class="text-gray-800 dark:text-white flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Connect to AI Studio</h2>
</div>
<div class="flex-grow px-4 py-6">
<p class="text-gray-600 dark:text-gray-300 text-base font-normal leading-normal pb-3 pt-1 text-center">
        Enter your Google AI Studio API key to unlock generative AI features. 
        <a class="text-primary font-medium" href="#">Learn how to get your key</a>
</p>
<div class="flex max-w-[480px] flex-wrap items-end gap-4 py-3 mx-auto">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">API Key</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your API Key" type="password"/>
<div class="text-gray-400 dark:text-gray-500 flex border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 items-center justify-center pr-[15px] rounded-r-lg border-l-0">
<span class="material-symbols-outlined text-2xl cursor-pointer">visibility_off</span>
</div>
</div>
</label>
</div>
<div class="flex px-4 py-3 justify-center">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Save Key</span>
</button>
</div>
<div class="mt-6">
<!-- Example of a success message -->
<div class="flex items-center gap-4 bg-green-100 dark:bg-green-900/30 p-4 rounded-lg max-w-[480px] mx-auto">
<div class="text-green-600 dark:text-green-400 flex items-center justify-center shrink-0 size-10">
<span class="material-symbols-outlined text-2xl">check_circle</span>
</div>
<p class="text-green-800 dark:text-green-200 text-base font-normal leading-normal flex-1 truncate">API Key saved successfully.</p>
<div class="shrink-0">
<div class="text-green-600 dark:text-green-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl cursor-pointer">close</span>
</div>
</div>
</div>
<!-- Example of an error message -->
<div class="flex items-center gap-4 bg-red-100 dark:bg-red-900/30 p-4 rounded-lg max-w-[480px] mx-auto mt-4">
<div class="text-red-600 dark:text-red-400 flex items-center justify-center shrink-0 size-10">
<span class="material-symbols-outlined text-2xl">error</span>
</div>
<p class="text-red-800 dark:text-red-200 text-base font-normal leading-normal flex-1 truncate">Invalid API Key. Please check your key and try again.</p>
<div class="shrink-0">
<div class="text-red-600 dark:text-red-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-2xl cursor-pointer">close</span>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
